name: Version Check

on:
  push:
    branches:
      - master
      - v2
  pull_request:
    branches:
      - master
      - v2

jobs:
  version-bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run version bump check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_ref="origin/${{ github.base_ref }}"
            git fetch origin "${{ github.base_ref }}" --depth=1
            scripts/check-version-bump.sh --range "$base_ref" HEAD
          else
            if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
              echo "Initial push detected; skipping version comparison."
              exit 0
            fi
            scripts/check-version-bump.sh --range "${{ github.event.before }}" "${{ github.sha }}"
          fi
